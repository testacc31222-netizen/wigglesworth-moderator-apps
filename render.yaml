services:
  - type: web
    name: wigglesworth-moderator-apps
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: EDIT_CODE
        sync: false
